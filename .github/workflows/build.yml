name: Build and Publish Kryn UI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Direct Download
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/*.apk release_output/kryn-ui.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kryn UI Latest Build"
          files: release_output/kryn-ui.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
