name: Build and Publish Kryn UI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Permanent Keystore Exists
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "Generating permanent keystore..."
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kryn Labs,O=Kryn Joint Labs,C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: save permanent signing keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Versioned Release
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/*.apk release_output/kryn-ui-v1.2.apk
          cp app/build/outputs/apk/debug/*.apk release_output/kryn-ui.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kryn UI v1.2 Release"
          files: |
            release_output/kryn-ui-v1.2.apk
            release_output/kryn-ui.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
