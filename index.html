<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRYN UI — Desktop-Grade Widgets for Android</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }
    body {
      background-color: #090a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e10600;
      background: rgba(225, 6, 0, 0.1);
      border: 1px solid rgba(225, 6, 0, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    p {
      color: #8e8e93;
      max-width: 480px;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 36px;
    }
    .card-preview {
      width: 100%;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .clock {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
      color: #8e8e93;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn {
      display: inline-block;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <span class="badge">KRYN JOINT LABS</span>
  <h1>DESKTOP-GRADE<br/>WIDGETS.</h1>
  <p>Clean, brutalist telemetry and minimalist widgets engineered for Android home screens.</p>

  <div class="card-preview">
    <div class="clock" id="live-clock">12:00</div>
    <div class="meta-row">
      <span style="color: #e10600; font-weight: bold;">KRYN dft // 01</span>
      <span>SYSTEM ONLINE</span>
    </div>
  </div>

  <a href="#download" class="btn">Download APK (Coming Soon)</a>

  <script>
    function updateTime() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('live-clock').innerText = `${hrs}:${mins}`;
    }
    setInterval(updateTime, 1000);
    updateTime();
  </script>
</body>
</html>
